name: Auto Unzip
on:
  workflow_dispatch:

jobs:
  unzip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Unzip file
        run: |
          for file in *.zip; do
            if [ -f "$file" ]; then
              unzip -o "$file" -d .
              rm "$file"
            fi
          done
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Auto-unzipped files" || echo "No changes"
          git push
