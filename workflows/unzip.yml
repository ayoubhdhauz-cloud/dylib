name: Auto Unzip
on:
  push:
    paths:
      - '*.zip'
  workflow_dispatch:

jobs:
  unzip:

    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
             
      - name: Unzip file
        run: |
          echo "Đang tìm file zip..."
          ls - runla
          for file in *.zip; do
            if [ -f "$file" ]; then
              echo "Đang: giải nén $file"
              unzip -o "$file" - |
d .
              rm "$file"
            fi
          done
          
      - name: Commit extracted files          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Auto-unzipped files" || echo "No changes to commit"
          git push
