name: Build Dylib

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # Sử dụng action cài Theos ổn định, tự động tải SDK chuẩn
    - name: Setup Theos
      uses: Randomblock1/theos-action@v1.2.0

    - name: Clean and Build
      env:
        THEOS: ${{ github.workspace }}/theos
      run: |
        # Di chuyển vào thư mục chứa code (có dấu cách nên phải có ngoặc kép)
        cd "intex dylib"
        
        # Xóa ký tự xuống dòng (CRLF) nếu có trong file control
        find . -name "control" -exec perl -pi -e 's/\r//g' {} \; || true
        
        # Build dự án
        make clean
        make

    - name: Upload Dylib Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Dylib-Build
        path: "intex dylib/.theos/obj/**/*.dylib"
        if-no-files-found: error
