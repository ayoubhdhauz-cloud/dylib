name: Build dylib

on:
  push:
    branches: [ main ]      # Tự động kích hoạt khi push lên main
  workflow_dispatch:        # Đồng thời cho phép kích hoạt thủ công

jobs:
  build-macos:
    runs-on: macos-latest   # Sử dụng máy ảo macOS do GitHub cung cấp
    steps:
      - uses: actions/checkout@v4

      - name: Build dylib
        run: |
          # ===== Thay thế bằng lệnh build thực tế của dự án bạn =====
          # Ví dụ C/C++ (CMake):
          # mkdir build && cd build
          # cmake .. -DBUILD_SHARED_LIBS=ON
          # make
          #
          # Ví dụ Rust:
          # cargo build --release
          # ==========================================

      - name: Upload dylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: dylib-output
          # Sửa thành đường dẫn tệp .dylib thực tế được tạo ra
          path: |
            build/**/*.dylib
            target/release/**/*.dylib
          if-no-files-found: warn
