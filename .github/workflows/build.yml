name: Build Dylib

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          export THEOS=$HOME/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          
      - name: Build Dylib
        run: |
          export THEOS=$HOME/theos
          # Lấy đúng phiên bản Theos cho dự án
          make clean
          make
        env:
          # Đảm bảo sử dụng clang và SDK có sẵn của macOS
          TARGET: iphone:clang:16.5:13.0
          ARCHS: arm64

      - name: Upload Dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOSViet-Dylib
          # Theos thường lưu file dylib ở thư mục .theos/obj/arm64/
          # Hoặc nếu cấu hình gốc của bạn lưu ở thư mục khác, hãy đổi path cho đúng
          path: .theos/obj/arm64/*.dylib
